        hiding: '<#57e389>Hiding range indicators</#57e389>'
        hint: |-
          <#e36b57>Red Barrier icons </#e36b57><white>show the current [prefix_island] protected range limit.</white>
          <gray>Gray Particles </gray><white>show the max [prefix_island] limit.</white>
          <#57e389>Green Particles </#57e389><white>show the default protected range if the [prefix_island] protection range differs from it.</white>
        showing: '<#57e389>Showing range indicators</#57e389>'
      set:
        parameters: <player> <range> [[prefix_island] location]
        description: sets the [prefix_island] protected range
        success: '<#57e389>Set [prefix_island] protection range to </#57e389><#4d9be6>[number]</#4d9be6><#57e389>.</#57e389>'
      reset:
        parameters: <player>
        description: resets the [prefix_island] protected range to the world default
        success: '<#57e389>Reset [prefix_island] protection range to </#57e389><#4d9be6>[number]</#4d9be6><#57e389>.</#57e389>'
      add:
        description: increases the [prefix_island] protected range
        parameters: <player> <range> [[prefix_island] location]
        success: '<#57e389>Successfully increased </#57e389><#4d9be6>[name]</#4d9be6><#57e389>''s [prefix_island] protected
          range to </#57e389><#4d9be6>[total] </#4d9be6><gray>(</gray><#4d9be6>+[number]</#4d9be6><gray>)</gray><#57e389>.</#57e389>'
      remove:
        description: decreases the [prefix_island] protected range
        parameters: <player> <range> [[prefix_island] location]
        success: '<#57e389>Successfully decreased </#57e389><#4d9be6>[name]</#4d9be6><#57e389>''s [prefix_island] protected
          range to </#57e389><#4d9be6>[total] </#4d9be6><gray>(</gray><#4d9be6>-[number]</#4d9be6><gray>)</gray><#57e389>.</#57e389>'
      removebonus:
        parameters: <player> [id]
        description: removes bonus ranges from the [prefix_island] (all, or one by id)
        no-bonus: '<#e36b57>This [prefix_island] has no bonus ranges to remove!</#e36b57>'
        unknown-bonus: '<#e36b57>There is no bonus range with id </#e36b57><#4d9be6>[id]</#4d9be6><#e36b57> on this [prefix_island]!</#e36b57>'
        success: '<#57e389>Removed </#57e389><#4d9be6>[number]</#4d9be6><#57e389> of bonus range from </#57e389><#4d9be6>[name]</#4d9be6><#57e389>''s [prefix_island].</#57e389>'
        success-id: '<#57e389>Removed bonus range </#57e389><#4d9be6>[id]</#4d9be6><#57e389> (</#57e389><#4d9be6>[number]</#4d9be6><#57e389>) from </#57e389><#4d9be6>[name]</#4d9be6><#57e389>''s [prefix_island].</#57e389>'
      purgebonus:
        parameters: <id>
        description: removes a bonus range id from every [prefix_island] (e.g. after removing the addon that added it)
        none: '<#e36b57>No [prefix_island] has a bonus range with id </#e36b57><#4d9be6>[id]</#4d9be6><#e36b57>!</#e36b57>'
        warning: '<#fbb954>This will remove bonus range </#fbb954><#4d9be6>[id]</#4d9be6><#fbb954> from </#fbb954><#4d9be6>[number]</#4d9be6><#fbb954> island(s).</#fbb954>'
        success: '<#57e389>Removed bonus range </#57e389><#4d9be6>[id]</#4d9be6><#57e389> from </#57e389><#4d9be6>[number]</#4d9be6><#57e389> island(s).</#57e389>'
        confirm: '<#fbb954>Run the command again with </#fbb954><#4d9be6>confirm</#4d9be6><#fbb954> to proceed.</#fbb954>'
        in-progress: '<#e36b57>A bonus range purge is already running. Please wait.</#e36b57>'
