        not-in-team: '<#e36b57>This player is not in a team.</#e36b57>'
        admin-kicked: '<#e36b57>The admin kicked you from the team.</#e36b57>'
        success: '<#4d9be6>[name] </#4d9be6><#57e389>has been kicked from </#57e389><#4d9be6>[owner]</#4d9be6><#57e389>''s [prefix_island].</#57e389>'
      setowner:
        parameters: <player> [island owner]
        description: >-
          transfers [prefix_island] ownership to the player. Name the current island owner to run it from the console
        already-owner: '<#e36b57>[name] is already the owner of this [prefix_island]!</#e36b57>'
        must-be-on-island: '<#e36b57>You must be on the [prefix_island] to set the owner</#e36b57>'
        specify-island: >-
          <#e36b57>Stand on the [prefix_island] and run this in-game, or name the island's current owner: </#e36b57><#ffeb57>setowner <player> <island owner></#ffeb57>
        confirmation: '<#57e389>Are you sure you want to set [name] to be the owner of the
          [prefix_island] at [xyz]?</#57e389>'
        success: '<#4d9be6>[name]</#4d9be6><#57e389> is now the owner of this [prefix_island].</#57e389>'
        errors:
          at-max: '<#e36b57>[name] already owns [number] [prefix_islands] - the maximum
