      title: '<#57e389>Choose your game</#57e389>'
  errors:
    command-cancelled: '<#e36b57>✖ Command cancelled.</#e36b57>'
    no-permission: '<#e36b57>✖ You don''t have the permission to execute this command (</#e36b57><gray>
      [permission]</gray><#e36b57>).</#e36b57>'
    insufficient-rank: '<#e36b57>✖ Your rank is not high enough to do that! (</#e36b57><gray>[rank]</gray><#e36b57>)</#e36b57>'
    use-in-game: '<#e36b57>✖ This command is only available in-game.</#e36b57>'
    use-in-console: '<#e36b57>✖ This command is only available in the console.</#e36b57>'
    no-team: '<#e36b57>✖ You do not have a team!</#e36b57>'
    no-island: '<#e36b57>✖ You do not have [prefix_an-island]!</#e36b57>'
    player-has-island: '<#e36b57>✖ Player already has [prefix_an-island]!</#e36b57>'
    player-has-no-island: '<#e36b57>✖ That player has no [prefix_island]!</#e36b57>'
    already-have-island: '<#e36b57>✖ You already have [prefix_an-island]!</#e36b57>'
    no-safe-location-found: '<#e36b57>✖ Could not find a safe spot to teleport you to on the
      [prefix_island].</#e36b57>'
    not-owner: '<#e36b57>✖ You are not the owner of the [prefix_island]!</#e36b57>'
    player-is-not-owner: '<#4d9be6>[name] </#4d9be6><#e36b57>is not the owner of [prefix_an-island]!</#e36b57>'
    not-in-team: '<#e36b57>✖ That player is not in your team!</#e36b57>'
    offline-player: '<#e36b57>✖ That player is offline or doesn''t exist.</#e36b57>'
    unknown-player: '<#e36b57>✖ [name] is an unknown player!</#e36b57>'
    general: '<#e36b57>✖ That command is not ready yet - contact admin</#e36b57>'
    unknown-command: '<#e36b57>✖ Unknown command. Do </#e36b57><#4d9be6>/[label] help </#4d9be6><#e36b57>for help.</#e36b57>'
    wrong-world: '<#e36b57>✖ You are not in the right world to do that!</#e36b57>'
    you-must-wait: '<#e36b57>✖ You must wait [number]s before you can do that command again.</#e36b57>'
    must-be-positive-number: '<#e36b57>✖ [number] is not a valid positive number.</#e36b57>'
    not-on-island: '<#e36b57>✖ You are not on [prefix_island]!</#e36b57>'
    slow-down: '<#e36b57>✖ Slow down. Click slower.</#e36b57>'
  did-you-mean:
    suggestion: '<gray>Did you mean </gray><#ffeb57>[command]</#ffeb57><gray>? Click here
      or type </gray><#57e389>yes</#57e389><gray> to run it.</gray>[run_command: [command]][hover: Click to run [command]]'
    header: '<gray>Did you mean one of these? Click one to run it:</gray>'
    option: '<#ffeb57>  [command]</#ffeb57>[run_command: [command]][hover: Click to run [command]]'
  worlds:
    overworld: Overworld
    nether: Nether
    the-end: The End

commands:
  # Parameters in <> are required, parameters in [] are optional
  help:
    header: '<dark_gray>─────── </dark_gray><#a884f3>⚑ <bold>[label] HELP</bold></#a884f3><dark_gray> ───────</dark_gray>'
    syntax: '<#4d9be6>⏵ [usage] </#4d9be6><#57e389>[parameters]</#57e389><dark_gray> » </dark_gray><white>[description]</white>'
    syntax-no-parameters: '<#4d9be6>⏵ [usage]</#4d9be6><dark_gray> » </dark_gray><white>[description]</white>'
    end: '<dark_gray>──────────────────────────</dark_gray>'
    page: '<gray>Page </gray><#ffeb57>[page]</#ffeb57><gray> of </gray><#ffeb57>[total]</#ffeb57>'
    parameters: '[command]'
    description: help command
    console: Console
  admin:
    help:
      description: admin command
    maxhomes:
      description: change the number of homes allowed on this [prefix_island] or player's
        [prefix_island]
      parameters: <number / player> <number> [[prefix_island] name]
      max-homes-set: '<#57e389>[name] - Set [prefix_island] max homes to [number]</#57e389>'
      errors:
        unknown-island: Unknown [prefix_island]! [name]
    resethome:
      description: Reset the player's home to default
      parameters: <player> [[prefix_island] name]
      cleared: '<#4d9be6>Home reset. [name]</#4d9be6>'
    resets:
      description: edit player reset values
      set:
        description: sets how many times this player has reset his [prefix_island]
        parameters: <player> <resets>
        success: '<#4d9be6>[name]</#4d9be6><#57e389>''s [prefix_island] reset count is now </#57e389><#4d9be6>[number]</#4d9be6><#57e389>
          .</#57e389>'
      reset:
        description: sets the player's [prefix_island] reset count to 0
        parameters: <player>
        success-everyone: '<#57e389>Successfully reset </#57e389><#4d9be6>everyone</#4d9be6><#57e389>''s reset count to
          </#57e389><#4d9be6>0</#4d9be6><#57e389>.</#57e389>'
        success: '<#57e389>Successfully reset </#57e389><#4d9be6>[name]</#4d9be6><#57e389>''s reset count to </#57e389><#4d9be6>0</#4d9be6><#57e389>.</#57e389>'
      add:
        description: adds this player's [prefix_island] reset count
        parameters: <player> <resets>
        success: '<#57e389>Successfully added </#57e389><#4d9be6>[number] </#4d9be6><#57e389>resets to </#57e389><#4d9be6>[name], increasing
          the total to </#4d9be6><#4d9be6>[total]</#4d9be6><#57e389> resets.</#57e389>'
      remove:
        description: reduces the player's [prefix_island] reset count
        parameters: <player> <resets>
        success: '<#57e389>Successfully removed </#57e389><#4d9be6>[number] </#4d9be6><#57e389>resets from </#57e389><#4d9be6>[name]''s
          [prefix_island]</#4d9be6><#57e389>, decreasing the total to </#57e389><#4d9be6>[total]</#4d9be6><#57e389>resets.</#57e389>'
    purge:
      parameters: '[days]'
      description: 'delete region files for [prefix_Islands] untouched for more than [days] days (frees disk)'
      days-one-or-more: '<#e36b57>Must be at least 1 day or more</#e36b57>'
      purgable-islands: '<#57e389>Found </#57e389><#4d9be6>[number] </#4d9be6><#57e389>purgable [prefix_Islands].</#57e389>'
      purge-in-progress: '<#e36b57>Purging in progress. Please wait for it to finish.</#e36b57>'
      scanning: '<#57e389>Scanning region files. This may take a while depending on world size...</#57e389>'
      none-found: '<#e36b57>No [prefix_Islands] found to purge.</#e36b57>'
      confirm: '<#a884f3>Type </#a884f3><#4d9be6>/[label] purge confirm </#4d9be6><#a884f3>to start purging</#a884f3>'
      failed: '<#e36b57>Purge completed with errors. Some region files could not be deleted. Check the server log for details.</#e36b57>'
      age-regions:
        parameters: '[days]'
        description: 'debug/test: rewrite region file timestamps so they become purgable'
        done: '<#57e389>Aged </#57e389><#4d9be6>[number]</#4d9be6><#57e389> region file(s) in the current world.</#57e389>'
      deleted:
        parameters: ''
        description: 'purge region files for any [prefix_island] already flagged as deleted'
        confirm: '<#a884f3>Type </#a884f3><#4d9be6>/[label] purge deleted confirm </#4d9be6><#a884f3>to reap the region files</#a884f3>'
        deferred: '<#57e389>Region files deleted. Island database entries will be removed on next server restart.</#57e389>'
      protect:
        description: toggle [prefix_island] purge protection
        move-to-island: '<#e36b57>Move to [prefix_an-island] first!</#e36b57>'
        protecting: '<#57e389>Protecting [prefix_island] from purge.</#57e389>'
        unprotecting: '<#57e389>Removing purge protection.</#57e389>'
      unowned:
        parameters: ''
        description: flag unowned [prefix_Islands] as deletable so they can be reaped
        unowned-islands: '<#57e389>Found </#57e389><#4d9be6>[number] </#4d9be6><#57e389>unowned [prefix_Islands].</#57e389>'
        flagged: '<#57e389>Flagged </#57e389><#4d9be6>[number] </#4d9be6><#57e389>[prefix_island](s) as deletable. Run </#57e389><#4d9be6>/[label] purge deleted</#4d9be6><#57e389> to reap the region files.</#57e389>'
    team:
      description: manage teams
      add:
        parameters: <owner> <player>
        description: add player to owner's team
        name-not-owner: '<#e36b57>[name] is not the owner.</#e36b57>'
        name-has-island: '<#e36b57>[name] has [prefix_an-island]. Unregister or delete them
          first!</#e36b57>'
        success: '<#4d9be6>[name]</#4d9be6><#57e389> has been added to </#57e389><#4d9be6>[owner]</#4d9be6><#57e389>''s [prefix_island].</#57e389>'
      disband:
        parameters: <owner>
        description: disband owner's team
        use-disband-owner: '<#e36b57>Not owner! Use disband [owner].</#e36b57>'
        disbanded: '<#e36b57>Admin disbanded your team!</#e36b57>'
        success: '<#4d9be6>[name]</#4d9be6><#57e389>''s team has been disbanded.</#57e389>'
      disbandall:
        description: strip every member and sub-owner from every [prefix_island] in this world
        confirmation: '<#e36b57>This will remove every member and sub-owner from every [prefix_island] in this world. Trusted and coop players will not be affected. Type the confirmation command to proceed.</#e36b57>'
        success: '<#57e389>Removed </#57e389><#4d9be6>[number]</#4d9be6><#57e389> members from </#57e389><#4d9be6>[islands]</#4d9be6><#57e389> [prefix_islands].</#57e389>'
      fix:
        description: scans and fixes cross [prefix_island] membership in database
        scanning: Scanning database...
        duplicate-owner: '<#e36b57>Player owns more than one [prefix_island] in the database:
          [name]</#e36b57>'
        player-has: '<#e36b57>Player [name] has [number] islands</#e36b57>'
        duplicate-member: '<#e36b57>Player [name] is a member of more than one [prefix_island]
          in the database</#e36b57>'
        rank-on-island: '<#e36b57>[rank] on [prefix_island] at [xyz]</#e36b57>'
        fixed: '<#57e389>Fixed</#57e389>'
        done: '<#57e389>Scan</#57e389>'
