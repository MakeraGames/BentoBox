meta:
  authors:
  - tastybento
  - Poslovitch
  banner: WHITE_BANNER:1:STRIPE_SMALL:RED:SQUARE_TOP_RIGHT:CYAN:SQUARE_TOP_RIGHT:BLUE

prefixes:
  bentobox: '<#a884f3>⚑ <bold>FRAMEWORK</bold> </#a884f3><dark_gray>» </dark_gray><white>'
  island: island
  Island: Island
  Islands: Islands
  an-island: an island
  islands: islands
general:
  success: '<#57e389>✓ Success!</#57e389>'
  invalid: Invalid
  beta: '<#a884f3><bold>This command is in beta. Make sure you have backups!</bold></#a884f3>'
