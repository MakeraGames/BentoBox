            more.</#e36b57>'
        extra-islands: '<#e36b57>Warning: this player now owns [number] islands. This is
          more than allowed by settings or perms: [max].</#e36b57>'
      maxsize:
        parameters: <player> <size>
        description: Set the max team size for a player's [prefix_island] (use 0 to reset to world default)
        success: '<#57e389>Set </#57e389><#4d9be6>[name]</#4d9be6><#57e389>''s [prefix_island] max team size to </#57e389><#4d9be6>[number]</#4d9be6><#57e389>.</#57e389>'
        reset: '<#57e389>Reset </#57e389><#4d9be6>[name]</#4d9be6><#57e389>''s [prefix_island] max team size to the world default (</#57e389><#4d9be6>[number]</#4d9be6><#57e389>).</#57e389>'
    range:
      description: admin [prefix_island] range command
      invalid-value:
        too-low: '<#e36b57>The protection range must be greater than </#e36b57><#4d9be6>1</#4d9be6><#e36b57>!</#e36b57>'
        too-high: '<#e36b57>The protection range should be equal or less than </#e36b57><#4d9be6>[number]</#4d9be6><#e36b57>
          !</#e36b57>'
        same-as-before: '<#e36b57>The protection range is already set to </#e36b57><#4d9be6>[number]</#4d9be6><#e36b57>!</#e36b57>'
      display:
